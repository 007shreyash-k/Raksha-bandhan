<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raksha Bandhan Interactive Celebration</title>
  
  <!-- Canvas Confetti & html2canvas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #ff758c 0%, #ff7eb3 50%, #764ba2 100%);
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      color: #333;
      overflow-x: hidden;
      position: relative;
    }

    .petal {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 150px 0 150px 0;
      pointer-events: none;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .card-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
      z-index: 10;
      position: relative;
    }

    h1 { font-size: 1.8rem; color: #d81b60; margin-bottom: 6px; }
    .subtitle { font-size: 0.88rem; color: #666; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #444; margin-bottom: 4px; }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: #d81b60; }

    .style-picker { display: flex; justify-content: space-around; margin-top: 6px; }
    .style-option {
      font-size: 2rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .style-option.selected { border-color: #d81b60; background: #fff0f5; transform: scale(1.1); }

    .rakhi-zone { margin: 25px 0; }
    .rakhi-icon {
      font-size: 5rem;
      cursor: pointer;
      display: inline-block;
      user-select: none;
      filter: drop-shadow(0 8px 15px rgba(216, 27, 96, 0.3));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .rakhi-icon:hover { transform: scale(1.25) rotate(12deg); }
    .rakhi-hint { font-size: 0.85rem; color: #777; margin-top: 8px; font-weight: 500; }

    .message-box {
      display: none;
      background: linear-gradient(135deg, #fff0f5 0%, #fff 100%);
      border: 2px dashed #ff4081;
      padding: 24px;
      border-radius: 20px;
      margin-top: 20px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .message-box h2 { color: #c2185b; font-size: 1.3rem; margin-bottom: 10px; }
    .message-box p { font-size: 0.95rem; color: #444; line-height: 1.6; white-space: pre-line; }

    /* Scratch Card Container */
    .scratch-container {
      position: relative;
      width: 100%;
      height: 110px;
      margin: 18px 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
      border: 2px solid #ffd1dc;
    }
    .scratch-reveal-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff;
      color: #d81b60;
      font-weight: bold;
      font-size: 1.05rem;
      padding: 10px;
    }
    .scratch-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    .btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-whatsapp { background: #25D366; }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-secondary { background: #fff; color: #d81b60; border: 2px solid #d81b60; margin-top: 10px; }
    .btn-download { background: #764ba2; color: #fff; margin-top: 10px; }

    .hidden { display: none !important; }
    .toast { color: #2e7d32; font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>

  <div id="petals"></div>

  <div class="card-container" id="captureArea">
    <h1>Happy Raksha Bandhan 🧵✨</h1>
    <p class="subtitle" id="subtitle">Send a digital Rakhi & scratch card to anyone!</p>

    <!-- SENDER FORM -->
    <div id="senderForm">
      <div class="form-group">
        <label for="senderName">Your Name:</label>
        <input type="text" id="senderName" placeholder="e.g. Alex" />
      </div>

      <div class="form-group">
        <label for="receiverName">Receiver's Name:</label>
        <input type="text" id="receiverName" placeholder="e.g. Sam" />
      </div>

      <div class="form-group">
        <label for="relation">Relationship Context:</label>
        <select id="relation">
          <option value="sibling">Brother / Sister / Sibling 👫</option>
          <option value="partner">Partner / Wife / Husband / Girlfriend / Boyfriend ❤️</option>
          <option value="friend">Best Friend / Mentor / Chosen Family ✨</option>
        </select>
      </div>

      <div class="form-group">
        <label>Choose Rakhi Design:</label>
        <div class="style-picker">
          <span class="style-option selected" onclick="selectStyle('🌸', this)">🌸</span>
          <span class="style-option" onclick="selectStyle('🏵️', this)">🏵️</span>
          <span class="style-option" onclick="selectStyle('💎', this)">💎</span>
          <span class="style-option" onclick="selectStyle('🌺', this)">🌺</span>
        </div>
      </div>

      <div class="form-group">
        <label for="scratchReward">Funny Scratch Card Promise 🎟️:</label>
        <select id="scratchReward">
          <option value="👑 1-Week Full Rights over the TV Remote!">👑 TV Remote Monopoly</option>
          <option value="☕ 1 Free Coffee & Snack treat on me!">☕ Free Coffee & Treat</option>
          <option value="🍕 1 Late Night Pizza order (My Expense)!">🍕 Late Night Pizza Treat</option>
          <option value="🤫 I will keep 1 secret of yours safe forever!">🤫 Keep 1 Secret Safe</option>
        </select>
      </div>

      <div class="form-group">
        <label for="customMsg">Personal Message (Optional):</label>
        <textarea id="customMsg" rows="2" placeholder="Write your own custom note..."></textarea>
      </div>

      <button class="btn btn-whatsapp" onclick="shareWhatsApp()">Send via WhatsApp 💬</button>
      <button class="btn btn-secondary" onclick="copyLink()">Copy Shareable Link 🔗</button>
      <div id="toast" class="toast hidden">Link copied to clipboard!</div>
    </div>

    <!-- RECEIVER VIEW -->
    <div id="receiverZone" class="hidden">
      <div class="rakhi-zone">
        <div class="rakhi-icon" id="rakhiBtn" onclick="tieRakhi()">🌸</div>
        <p class="rakhi-hint" id="hintText">Tap the Rakhi to tie it & open your card!</p>
      </div>
    </div>

    <!-- REVEALED CARD -->
    <div class="message-box" id="messageCard">
      <h2 id="cardHeader"></h2>
      <p id="cardBody"></p>

      <!-- Scratch Card Component -->
      <div class="scratch-container" id="scratchContainer">
        <div class="scratch-reveal-text">
          <span>🎁 Your Secret Promise:</span>
          <span id="scratchText" style="font-size: 1.1rem; margin-top: 4px;"></span>
        </div>
        <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
      </div>

      <button class="btn btn-download" id="downloadBtn" onclick="downloadCard()">Download Card Image 📸</button>
      <button class="btn btn-secondary" id="createBtn" onclick="enableCreateMode()">Send one back or create your own ✨</button>
    </div>
  </div>

  <script>
    let chosenIcon = '🌸';

    // Ambient floating petals
    const petalsContainer = document.getElementById('petals');
    for (let i = 0; i < 12; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.width = Math.random() * 15 + 10 + 'px';
      petal.style.height = Math.random() * 20 + 15 + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 5 + 7 + 's';
      petal.style.animationDelay = Math.random() * 5 + 's';
      petalsContainer.appendChild(petal);
    }

    function selectStyle(icon, el) {
      chosenIcon = icon;
      document.querySelectorAll('.style-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    const defaultMessages = {
      sibling: { title: "To My Forever Support System!", text: "Thank you for always standing by me, laughing through memories, and having my back. Happy Raksha Bandhan!" },
      partner: { title: "To My Favorite Person & Partner!", text: "This bond goes beyond standard definitions—here is to mutual care, holding space for each other, and walking side by side through life." },
      friend: { title: "To My Chosen Family!", text: "Care and protection know no boundaries. Thank you for being someone I can always rely on!" }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const to = urlParams.get('to');
    const from = urlParams.get('from');
    const rel = urlParams.get('rel') || 'sibling';
    const iconParam = urlParams.get('icon') || '🌸';
    const msgParam = urlParams.get('msg');
    const rewardParam = urlParams.get('reward') || '👑 1-Week Monopoly over TV Remote!';

    if (to && from) {
      document.getElementById('senderForm').classList.add('hidden');
      document.getElementById('receiverZone').classList.remove('hidden');
      document.getElementById('subtitle').innerText = `Special Rakhi Greeting for ${to}!`;
      document.getElementById('rakhiBtn').innerText = iconParam;
      document.getElementById('scratchText').innerText = rewardParam;
    }

    function buildUrl() {
      const sender = document.getElementById('senderName').value.trim();
      const receiver = document.getElementById('receiverName').value.trim();
      const relation = document.getElementById('relation').value;
      const customMsg = document.getElementById('customMsg').value.trim();
      const scratchReward = document.getElementById('scratchReward').value;

      if (!sender || !receiver) {
        alert("Please enter both your name and the receiver's name!");
        return null;
      }

      const baseUrl = window.location.href.split('?')[0];
      let url = `${baseUrl}?to=${encodeURIComponent(receiver)}&from=${encodeURIComponent(sender)}&rel=${encodeURIComponent(relation)}&icon=${encodeURIComponent(chosenIcon)}&reward=${encodeURIComponent(scratchReward)}`;
      if (customMsg) url += `&msg=${encodeURIComponent(customMsg)}`;
      return url;
    }

    function copyLink() {
      const url = buildUrl();
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
      });
    }

    function shareWhatsApp() {
      const url = buildUrl();
      if (!url) return;
      const sender = document.getElementById('senderName').value.trim();
      const receiver = document.getElementById('receiverName').value.trim();
      const text = `Hey ${receiver}! 🧵✨ ${sender} sent you an interactive Raksha Bandhan greeting with a hidden scratch card. Tap here to open: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function playSparkleSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.08);
        osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
      });
    }

    function initScratchCard() {
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('scratchContainer');
      
      canvas.width = container.offsetWidth;
      canvas.height = container.offsetHeight;

      // Draw Gold Foil Surface
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = '600 14px Poppins';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('Scratch here with your finger/mouse! 🪙', canvas.width / 2, canvas.height / 2 + 5);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('mouseup', () => isDrawing = false);

      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('touchmove', scratch);
      canvas.addEventListener('touchend', () => isDrawing = false);
    }

    function tieRakhi() {
      const rakhiBtn = document.getElementById('rakhiBtn');
      const messageCard = document.getElementById('messageCard');
      const cardHeader = document.getElementById('cardHeader');
      const cardBody = document.getElementById('cardBody');
      const hintText = document.getElementById('hintText');

      playSparkleSound();
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });

      rakhiBtn.style.transform = 'scale(1.5) rotate(360deg)';

      const template = defaultMessages[rel] || defaultMessages.sibling;
      cardHeader.innerText = `Dear ${to}, ${template.title}`;
      
      const textContent = msgParam ? msgParam : template.text;
      cardBody.innerText = `"${textContent}"\n\nWith love,\n— ${from}`;

      setTimeout(() => {
        hintText.innerText = "✨ Rakhi Tied Successfully! ✨";
        messageCard.style.display = 'block';
        initScratchCard();
      }, 400);
    }

    function downloadCard() {
      const captureElement = document.getElementById('captureArea');
      const downloadBtn = document.getElementById('downloadBtn');
      const createBtn = document.getElementById('createBtn');

      // Temporarily hide action buttons during screenshot
      downloadBtn.style.display = 'none';
      createBtn.style.display = 'none';

      html2canvas(captureElement, { scale: 2 }).then(canvas => {
        const image = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = image;
        link.download = `Raksha_Bandhan_${to || 'Greeting'}.png`;
        link.click();

        // Restore action buttons
        downloadBtn.style.display = 'flex';
        createBtn.style.display = 'flex';
      });
    }

    function enableCreateMode() {
      document.getElementById('receiverZone').classList.add('hidden');
      document.getElementById('messageCard').style.display = 'none';
      document.getElementById('senderForm').classList.remove('hidden');
      document.getElementById('subtitle').innerText = "Send a digital Rakhi & scratch card to anyone!";
      document.getElementById('senderName').value = '';
      document.getElementById('receiverName').value = '';
      document.getElementById('customMsg').value = '';
    }
  </script>
</body>
</html>
