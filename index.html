<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Raksha Bandhan 🧵✨</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a0826 0%, #0d0414 100%);
      font-family: 'Poppins', sans-serif;
      padding: 16px;
      color: #333;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Floating Petals Animation */
    .petal-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .petal {
      position: absolute;
      background: rgba(255, 215, 0, 0.25);
      border-radius: 150px 0 150px 0;
      pointer-events: none;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Card Layout */
    .card-container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      width: 100%;
      max-width: 450px;
      padding: 28px;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 20px rgba(252, 211, 77, 0.2);
      text-align: center;
      z-index: 10;
      position: relative;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    h1 {
      font-size: 1.7rem;
      color: #991b1b;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 18px;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      display: block;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #fde68a;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
      background: #fffdf5;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #d97706;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    /* Rakhi Style Picker */
    .style-picker {
      display: flex;
      justify-content: space-around;
      margin-top: 6px;
    }

    .style-option {
      font-size: 2rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .style-option:hover {
      transform: scale(1.1);
    }

    .style-option.selected {
      border-color: #d97706;
      background: #fffbeeb3;
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
    }

    /* Interactive Rakhi Zone */
    .rakhi-zone {
      margin: 20px 0;
    }

    .rakhi-icon {
      font-size: 5.2rem;
      cursor: pointer;
      display: inline-block;
      user-select: none;
      filter: drop-shadow(0 10px 18px rgba(217, 119, 6, 0.4));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rakhi-icon:hover {
      transform: scale(1.2) rotate(12deg);
    }

    .rakhi-hint {
      font-size: 0.85rem;
      color: #78350f;
      margin-top: 8px;
      font-weight: 600;
    }

    /* Message Reveal Card */
    .message-box {
      display: none;
      background: linear-gradient(135deg, #fffbeb 0%, #ffffff 100%);
      border: 2px solid #f59e0b;
      padding: 20px;
      border-radius: 18px;
      margin-top: 15px;
      animation: popIn 0.4s ease forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Metallic Scratch Card */
    .scratch-card-wrapper {
      margin: 16px 0;
      border-radius: 16px;
      padding: 2px;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .scratch-container {
      position: relative;
      width: 100%;
      height: 110px;
      border-radius: 14px;
      overflow: hidden;
      background: #fffdf5;
    }

    .scratch-reveal-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .scratch-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #92400e;
      background: #fef3c7;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .scratch-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1e1b4b;
      text-align: center;
    }

    .scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
      transition: opacity 0.4s;
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
      width: 100%;
      margin-top: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-wa {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    }

    .btn-sub {
      background: #ffffff;
      color: #991b1b;
      border: 2px solid #991b1b;
    }

    .btn-dl {
      background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Background Floating Petals -->
  <div class="petal-container" id="petals"></div>

  <!-- Main Card Container -->
  <div class="card-container" id="captureArea">
    <h1>Happy Raksha Bandhan 🧵✨</h1>
    <p class="subtitle" id="subtitle">Send a digital Rakhi & scratch card!</p>

    <!-- SENDER FORM -->
    <div id="senderForm">
      <div class="form-group">
        <label>Your Name (Sender):</label>
        <input type="text" id="from" placeholder="e.g. Rahul" />
      </div>

      <div class="form-group">
        <label>Receiver's Name:</label>
        <input type="text" id="to" placeholder="e.g. Priya" />
      </div>

      <div class="form-group">
        <label>Relationship Context:</label>
        <select id="rel">
          <option value="sibling">Brother / Sister / Sibling 👫</option>
          <option value="partner">Partner / Wife / Husband / Girlfriend / Boyfriend ❤️</option>
          <option value="friend">Best Friend / Chosen Family ✨</option>
        </select>
      </div>

      <div class="form-group">
        <label>Choose Rakhi Design:</label>
        <div class="style-picker">
          <span class="style-option selected" onclick="selectStyle('🌸', this)">🌸</span>
          <span class="style-option" onclick="selectStyle('🏵️', this)">🏵️</span>
          <span class="style-option" onclick="selectStyle('💎', this)">💎</span>
          <span class="style-option" onclick="selectStyle('🌺', this)">🌺</span>
        </div>
      </div>

      <div class="form-group">
        <label>What They Owe You (The Promise) 🔒:</label>
        <select id="reward">
          <option value="☕ 1 Tapri Chai & Samosa Treat (On Your Expense!)">☕ 1 Tapri Chai & Samosa Treat</option>
          <option value="🍕 Zomato/Swiggy Midnight Food Treat!">🍕 Zomato/Swiggy Midnight Food Treat</option>
          <option value="🎟️ 1 Movie Ticket + Popcorn Treat!">🎟️ 1 Movie Ticket + Popcorn Treat</option>
          <option value="🧹 Doing My Chores / Favors For 1 Whole Week!">🧹 Doing My Chores For 1 Week</option>
          <option value="🤫 Keeping 1 Deepest Secret Safe (No Judgments!)">🤫 Keeping 1 Deep Secret Safe</option>
        </select>
      </div>

      <div class="form-group">
        <label>Personal Note (Optional):</label>
        <textarea id="msg" rows="2" placeholder="Write a custom note..."></textarea>
      </div>

      <button class="btn btn-wa" onclick="shareWA()">Send via WhatsApp 💬</button>
      <button class="btn btn-sub" onclick="copyLink()">Copy Short Link 🔗</button>
    </div>

    <!-- RECEIVER VIEW -->
    <div id="receiverZone" class="hidden">
      <div class="rakhi-zone">
        <div class="rakhi-icon" id="rakhiBtn" onclick="tieRakhi()">🌸</div>
        <p class="rakhi-hint" id="hintText">Tap the Rakhi to tie it & open your scratch card!</p>
      </div>
    </div>

    <!-- REVEALED CARD -->
    <div class="message-box" id="messageCard">
      <h2 id="cardHeader" style="color:#991b1b; font-size:1.2rem; margin-bottom:6px;"></h2>
      <p id="cardBody" style="font-size:0.9rem; color:#374151; white-space:pre-line;"></p>

      <div class="scratch-card-wrapper">
        <div class="scratch-container" id="scratchContainer">
          <div class="scratch-reveal-content">
            <span class="scratch-badge">YOUR PROMISE TO ME 🔒</span>
            <span class="scratch-text" id="scratchText"></span>
          </div>
          <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
        </div>
      </div>

      <button class="btn btn-dl" id="dlBtn" onclick="downloadCard()">Download Card Image 📸</button>
      <button class="btn btn-sub" id="crBtn" onclick="location.href=window.location.pathname">Send One Back ✨</button>
    </div>
  </div>

  <script>
    let chosenIcon = '🌸';

    // Generate Floating Background Petals
    const petalsContainer = document.getElementById('petals');
    for (let i = 0; i < 14; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.width = Math.random() * 12 + 8 + 'px';
      petal.style.height = Math.random() * 16 + 10 + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 5 + 7 + 's';
      petal.style.animationDelay = Math.random() * 5 + 's';
      petalsContainer.appendChild(petal);
    }

    function selectStyle(icon, el) {
      chosenIcon = icon;
      document.querySelectorAll('.style-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    const defaultMessages = {
      sibling: "Thank you for always standing by me, laughing through memories, and having my back.",
      partner: "This bond goes beyond standard definitions—here is to mutual care and walking side by side.",
      friend: "Care and protection know no boundaries. Thank you for being someone I can always rely on!"
    };

    // Check URL parameters for receiver view
    const p = new URLSearchParams(window.location.search);
    let data = null;

    if (p.get('d')) {
      try { data = JSON.parse(atob(p.get('d'))); } catch(e){}
    }

    if (data) {
      document.getElementById('senderForm').classList.add('hidden');
      document.getElementById('receiverZone').classList.remove('hidden');
      document.getElementById('subtitle').innerText = `Special Rakhi Greeting for ${data.t || 'you'}!`;
      document.getElementById('rakhiBtn').innerText = data.i || '🌸';
      document.getElementById('scratchText').innerText = data.r;
    }

    function getShortUrl() {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const rel = document.getElementById('rel').value;
      const r = document.getElementById('reward').value;
      const msg = document.getElementById('msg').value.trim();

      if (!from || !to) { alert('Please enter both your name and the receiver name!'); return null; }

      const payload = { f: from, t: to, rel: rel, i: chosenIcon, r: r };
      if (msg) payload.m = msg;

      const encoded = btoa(JSON.stringify(payload));
      return `${window.location.origin}${window.location.pathname}?d=${encoded}`;
    }

    function shareWA() {
      const url = getShortUrl();
      if (!url) return;
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      
      const text = `Hey ${to}! 🧵✨ ${from} sent you a Raksha Bandhan card with a secret promise you owe them!\n\nTap to tie your Rakhi & scratch: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyLink() {
      const url = getShortUrl();
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => alert('Short link copied to clipboard!'));
    }

    function tieRakhi() {
      confetti({ particleCount: 120, spread: 80 });
      document.getElementById('cardHeader').innerText = `Dear ${data.t || 'Friend'}, Happy Raksha Bandhan! ✨`;
      
      const baseNote = defaultMessages[data.rel] || defaultMessages.sibling;
      const textContent = data.m ? data.m : baseNote;
      document.getElementById('cardBody').innerText = `"${textContent}"\n\nWith love,\n— ${data.f}`;

      document.getElementById('receiverZone').classList.add('hidden');
      document.getElementById('messageCard').style.display = 'block';
      initScratch();
    }

    function initScratch() {
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');
      const box = document.getElementById('scratchContainer');
      canvas.width = box.offsetWidth;
      canvas.height = box.offsetHeight;

      // Draw metallic gold overlay
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#d4af37');
      grad.addColorStop(0.3, '#fff6ad');
      grad.addColorStop(0.7, '#aa771c');
      grad.addColorStop(1, '#a67c1e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = '700 12px Poppins';
      ctx.fillStyle = '#4a3701';
      ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH HERE TO REVEAL ✨', canvas.width / 2, canvas.height / 2 + 4);

      let drawing = false;
      let done = false;

      function scratch(e) {
        if (!drawing || done) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();

        // Check clear threshold
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let clear = 0;
        for (let i = 3; i < imgData.data.length; i += 4) {
          if (imgData.data[i] === 0) clear++;
        }
        
        if ((clear / (imgData.data.length / 4)) > 0.7) {
          done = true;
          canvas.style.opacity = '0';
          setTimeout(() => canvas.style.display = 'none', 400);
          confetti({ particleCount: 90 });
        }
      }

      canvas.addEventListener('mousedown', (e) => { drawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('mouseup', () => drawing = false);
      canvas.addEventListener('touchstart', (e) => { drawing = true; scratch(e); });
      canvas.addEventListener('touchmove', scratch);
      canvas.addEventListener('touchend', () => drawing = false);
    }

    function downloadCard() {
      document.getElementById('dlBtn').style.display = 'none';
      document.getElementById('crBtn').style.display = 'none';
      html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `Rakhi_Greeting.png`;
        link.click();
        document.getElementById('dlBtn').style.display = 'block';
        document.getElementById('crBtn').style.display = 'block';
      });
    }
  </script>
</body>
</html>
