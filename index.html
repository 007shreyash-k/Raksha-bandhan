<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raksha Bandhan Digital Celebration</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #ff758c 0%, #ff7eb3 50%, #764ba2 100%);
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      color: #333;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Petals Ambient Background */
    .petal {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 150px 0 150px 0;
      pointer-events: none;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .card-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
      z-index: 10;
      position: relative;
    }

    h1 { font-size: 1.8rem; color: #d81b60; margin-bottom: 6px; }
    .subtitle { font-size: 0.88rem; color: #666; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #444; margin-bottom: 4px; }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus { border-color: #d81b60; }

    /* Style Selector */
    .style-picker {
      display: flex;
      justify-content: space-around;
      margin-top: 6px;
    }
    .style-option {
      font-size: 2rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .style-option.selected {
      border-color: #d81b60;
      background: #fff0f5;
      transform: scale(1.1);
    }

    /* Rakhi Tying Area */
    .rakhi-zone { margin: 25px 0; }
    .rakhi-icon {
      font-size: 5rem;
      cursor: pointer;
      display: inline-block;
      user-select: none;
      filter: drop-shadow(0 8px 15px rgba(216, 27, 96, 0.3));
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .rakhi-icon:hover { transform: scale(1.25) rotate(12deg); }
    .rakhi-hint { font-size: 0.85rem; color: #777; margin-top: 8px; font-weight: 500; }

    .message-box {
      display: none;
      background: linear-gradient(135deg, #fff0f5 0%, #fff 100%);
      border: 2px dashed #ff4081;
      padding: 24px;
      border-radius: 20px;
      margin-top: 20px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .message-box h2 { color: #c2185b; font-size: 1.3rem; margin-bottom: 10px; }
    .message-box p { font-size: 0.95rem; color: #444; line-height: 1.6; white-space: pre-line; }

    .btn {
      background: #d81b60;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-whatsapp { background: #25D366; }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-secondary { background: #fff; color: #d81b60; border: 2px solid #d81b60; margin-top: 12px; }

    .hidden { display: none !important; }
    .toast { color: #2e7d32; font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Floating Ambient Petals -->
  <div id="petals"></div>

  <div class="card-container">
    <h1>Happy Raksha Bandhan 🧵✨</h1>
    <p class="subtitle" id="subtitle">Send a digital Rakhi & special message to anyone!</p>

    <!-- SENDER FORM -->
    <div id="senderForm">
      <div class="form-group">
        <label for="senderName">Your Name:</label>
        <input type="text" id="senderName" placeholder="e.g. Alex" />
      </div>

      <div class="form-group">
        <label for="receiverName">Receiver's Name:</label>
        <input type="text" id="receiverName" placeholder="e.g. Sam" />
      </div>

      <div class="form-group">
        <label for="relation">Relationship Context:</label>
        <select id="relation">
          <option value="sibling">Brother / Sister / Sibling 👫</option>
          <option value="partner">Partner / Wife / Husband / Girlfriend / Boyfriend ❤️</option>
          <option value="friend">Best Friend / Mentor / Chosen Family ✨</option>
        </select>
      </div>

      <div class="form-group">
        <label>Choose Rakhi Design:</label>
        <div class="style-picker">
          <span class="style-option selected" onclick="selectStyle('🌸', this)">🌸</span>
          <span class="style-option" onclick="selectStyle('🏵️', this)">🏵️</span>
          <span class="style-option" onclick="selectStyle('💎', this)">💎</span>
          <span class="style-option" onclick="selectStyle('🌺', this)">🌺</span>
        </div>
      </div>

      <div class="form-group">
        <label for="customMsg">Personal Note (Optional):</label>
        <textarea id="customMsg" rows="2" placeholder="Write your own custom note or leave blank for template..."></textarea>
      </div>

      <button class="btn btn-whatsapp" onclick="shareWhatsApp()">Send via WhatsApp 💬</button>
      <button class="btn btn-secondary" onclick="copyLink()">Copy Shareable Link 🔗</button>
      <div id="toast" class="toast hidden">Link copied to clipboard!</div>
    </div>

    <!-- RECEIVER VIEW -->
    <div id="receiverZone" class="hidden">
      <div class="rakhi-zone">
        <div class="rakhi-icon" id="rakhiBtn" onclick="tieRakhi()">🌸</div>
        <p class="rakhi-hint" id="hintText">Tap the Rakhi to tie it & open your message!</p>
      </div>
    </div>

    <!-- REVEALED CARD -->
    <div class="message-box" id="messageCard">
      <h2 id="cardHeader"></h2>
      <p id="cardBody"></p>
      <button class="btn btn-secondary" onclick="enableCreateMode()">Send one back or create your own ✨</button>
    </div>
  </div>

  <script>
    let chosenIcon = '🌸';

    // Ambient floating petals generator
    const petalsContainer = document.getElementById('petals');
    for (let i = 0; i < 12; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.width = Math.random() * 15 + 10 + 'px';
      petal.style.height = Math.random() * 20 + 15 + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 5 + 7 + 's';
      petal.style.animationDelay = Math.random() * 5 + 's';
      petalsContainer.appendChild(petal);
    }

    function selectStyle(icon, el) {
      chosenIcon = icon;
      document.querySelectorAll('.style-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    const defaultMessages = {
      sibling: {
        title: "To My Forever Support System!",
        text: "Thank you for always standing by me, laughing through memories, and having my back. Happy Raksha Bandhan!"
      },
      partner: {
        title: "To My Favorite Person & Partner!",
        text: "This bond goes beyond standard definitions—here is to mutual care, holding space for each other, and walking side by side through life."
      },
      friend: {
        title: "To My Chosen Family!",
        text: "Care and protection know no boundaries. Thank you for being someone I can always rely on!"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const to = urlParams.get('to');
    const from = urlParams.get('from');
    const rel = urlParams.get('rel') || 'sibling';
    const iconParam = urlParams.get('icon') || '🌸';
    const msgParam = urlParams.get('msg');

    if (to && from) {
      document.getElementById('senderForm').classList.add('hidden');
      document.getElementById('receiverZone').classList.remove('hidden');
      document.getElementById('subtitle').innerText = `Special Rakhi Greeting for ${to}!`;
      document.getElementById('rakhiBtn').innerText = iconParam;
    }

    function buildUrl() {
      const sender = document.getElementById('senderName').value.trim();
      const receiver = document.getElementById('receiverName').value.trim();
      const relation = document.getElementById('relation').value;
      const customMsg = document.getElementById('customMsg').value.trim();

      if (!sender || !receiver) {
        alert("Please enter both your name and the receiver's name!");
        return null;
      }

      const baseUrl = window.location.href.split('?')[0];
      let url = `${baseUrl}?to=${encodeURIComponent(receiver)}&from=${encodeURIComponent(sender)}&rel=${encodeURIComponent(relation)}&icon=${encodeURIComponent(chosenIcon)}`;
      if (customMsg) url += `&msg=${encodeURIComponent(customMsg)}`;
      return url;
    }

    function copyLink() {
      const url = buildUrl();
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
      });
    }

    function shareWhatsApp() {
      const url = buildUrl();
      if (!url) return;
      const sender = document.getElementById('senderName').value.trim();
      const receiver = document.getElementById('receiverName').value.trim();
      const text = `Hey ${receiver}! 🧵✨ ${sender} sent you an interactive Raksha Bandhan greeting. Tap here to tie your Rakhi: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function playSparkleSound() {
      // Crystal chime sound via Web Audio API
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.08);
        osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
      });
    }

    function tieRakhi() {
      const rakhiBtn = document.getElementById('rakhiBtn');
      const messageCard = document.getElementById('messageCard');
      const cardHeader = document.getElementById('cardHeader');
      const cardBody = document.getElementById('cardBody');
      const hintText = document.getElementById('hintText');

      playSparkleSound();

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });

      rakhiBtn.style.transform = 'scale(1.5) rotate(360deg)';

      const template = defaultMessages[rel] || defaultMessages.sibling;
      cardHeader.innerText = `Dear ${to}, ${template.title}`;
      
      const textContent = msgParam ? msgParam : template.text;
      cardBody.innerText = `"${textContent}"\n\nWith love,\n— ${from}`;

      setTimeout(() => {
        hintText.innerText = "✨ Rakhi Tied Successfully! ✨";
        messageCard.style.display = 'block';
      }, 400);
    }

    function enableCreateMode() {
      document.getElementById('receiverZone').classList.add('hidden');
      document.getElementById('messageCard').style.display = 'none';
      document.getElementById('senderForm').classList.remove('hidden');
      document.getElementById('subtitle').innerText = "Send a digital Rakhi & special message to anyone!";
      document.getElementById('senderName').value = '';
      document.getElementById('receiverName').value = '';
      document.getElementById('customMsg').value = '';
    }
  </script>
</body>
</html>
