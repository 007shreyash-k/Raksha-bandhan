<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raksha Bandhan Card</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle, #1a0826 0%, #0d0414 100%);
      font-family: 'Poppins', sans-serif; padding: 16px; color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.96); width: 100%; max-width: 440px;
      padding: 24px; border-radius: 24px; text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255, 215, 0, 0.4);
    }
    h1 { font-size: 1.6rem; color: #991b1b; font-weight: 700; }
    .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 16px; }
    .group { margin-bottom: 12px; text-align: left; }
    label { font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 4px; display: block; }
    input, select, textarea {
      width: 100%; padding: 10px; border: 2px solid #fde68a; border-radius: 10px;
      font-size: 0.88rem; outline: none; background: #fffdf5;
    }
    .rakhi-icon { font-size: 4.8rem; cursor: pointer; display: inline-block; margin: 15px 0; }
    .message-box {
      display: none; background: #fffbeb; border: 2px solid #f59e0b;
      padding: 18px; border-radius: 16px; margin-top: 15px;
    }
    .scratch-wrap {
      margin: 15px 0; border-radius: 14px; padding: 2px;
      background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
    }
    .scratch-box { position: relative; width: 100%; height: 105px; border-radius: 12px; overflow: hidden; background: #fffdf5; }
    .scratch-content {
      position: absolute; width: 100%; height: 100%; display: flex;
      flex-direction: column; justify-content: center; align-items: center; padding: 8px;
    }
    .badge { font-size: 0.7rem; font-weight: 700; color: #92400e; background: #fef3c7; padding: 2px 8px; border-radius: 10px; }
    .scratch-text { font-size: 0.95rem; font-weight: 700; color: #1e1b4b; margin-top: 4px; text-align: center; }
    canvas { position: absolute; top:0; left:0; width:100%; height:100%; cursor: pointer; touch-action: none; transition: opacity 0.4s; }
    .btn {
      background: #991b1b; color: white; border: none; padding: 11px; border-radius: 14px;
      font-weight: 600; cursor: pointer; font-size: 0.88rem; width: 100%; margin-top: 8px;
    }
    .btn-wa { background: #15803d; }
    .btn-sub { background: #fff; color: #991b1b; border: 2px solid #991b1b; }
    .btn-dl { background: #4338ca; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card" id="captureArea">
    <h1>Happy Raksha Bandhan 🧵✨</h1>
    <p class="subtitle" id="subtitle">Send a Rakhi & demand your promise!</p>

    <!-- SENDER FORM -->
    <div id="senderForm">
      <div class="group">
        <label>Your Name (Sender):</label>
        <input type="text" id="from" placeholder="e.g. Rahul" />
      </div>

      <div class="group">
        <label>Receiver's Name:</label>
        <input type="text" id="to" placeholder="e.g. Priya" />
      </div>

      <div class="group">
        <label>Select What They Owe You (The Promise) 🔒:</label>
        <select id="reward">
          <option value="☕ 1 Tapri Chai & Samosa Treat (On Your Expense!)">☕ 1 Tapri Chai & Samosa Treat</option>
          <option value="🍕 Zomato/Swiggy Midnight Food Treat!">🍕 Zomato/Swiggy Midnight Food Treat</option>
          <option value="🎟️ 1 Movie Ticket + Popcorn Treat!">🎟️ 1 Movie Ticket + Popcorn Treat</option>
          <option value="🧹 Doing My Chores / Favors For 1 Whole Week!">🧹 Doing My Chores For 1 Week</option>
          <option value="🤫 1 Deepest Secret Saved Forever (No Judgments!)">🤫 Keeping 1 Deep Secret Safe</option>
        </select>
      </div>

      <div class="group">
        <label>Personal Note (Optional):</label>
        <textarea id="msg" rows="2" placeholder="Write a short note..."></textarea>
      </div>

      <button class="btn btn-wa" onclick="shareWA()">Send via WhatsApp 💬</button>
      <button class="btn btn-sub" onclick="copyLink()">Copy Short Link 🔗</button>
    </div>

    <!-- RECEIVER VIEW -->
    <div id="receiverZone" class="hidden">
      <div class="rakhi-icon" id="rakhiBtn" onclick="tieRakhi()">🌸</div>
      <p style="font-size:0.85rem; color:#78350f; font-weight:600;">Tap the Rakhi to tie it & open your scratch card!</p>
    </div>

    <!-- REVEALED CARD -->
    <div class="message-box" id="messageCard">
      <h2 id="cardHeader" style="color:#991b1b; font-size:1.2rem; margin-bottom:6px;"></h2>
      <p id="cardBody" style="font-size:0.9rem; color:#374151; white-space:pre-line;"></p>

      <div class="scratch-wrap">
        <div class="scratch-box" id="scratchContainer">
          <div class="scratch-content">
            <span class="badge">YOUR PROMISE TO ME 🔒</span>
            <span class="scratch-text" id="scratchText"></span>
          </div>
          <canvas id="scratchCanvas"></canvas>
        </div>
      </div>

      <button class="btn btn-dl" id="dlBtn" onclick="downloadCard()">Download Card Image 📸</button>
      <button class="btn btn-sub" id="crBtn" onclick="location.href=window.location.pathname">Send One Back ✨</button>
    </div>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    let data = null;

    if (p.get('d')) {
      try { data = JSON.parse(atob(p.get('d'))); } catch(e){}
    }

    if (data) {
      document.getElementById('senderForm').classList.add('hidden');
      document.getElementById('receiverZone').classList.remove('hidden');
      document.getElementById('subtitle').innerText = `Special Rakhi Greeting for ${data.t || 'you'}!`;
      document.getElementById('scratchText').innerText = data.r;
    }

    function getShortUrl() {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const r = document.getElementById('reward').value;
      const msg = document.getElementById('msg').value.trim();

      if (!from || !to) { alert('Please enter both your name and the receiver name!'); return null; }

      const payload = { f: from, t: to, r: r };
      if (msg) payload.m = msg;

      const encoded = btoa(JSON.stringify(payload));
      return `${window.location.origin}${window.location.pathname}?d=${encoded}`;
    }

    function shareWA() {
      const url = getShortUrl();
      if (!url) return;
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      
      const text = `Hey ${to}! 🧵✨ ${from} sent you a Raksha Bandhan card with a secret promise you owe them!\n\nTap to tie your Rakhi & scratch: ${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyLink() {
      const url = getShortUrl();
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => alert('Short link copied to clipboard!'));
    }

    function tieRakhi() {
      confetti({ particleCount: 120, spread: 80 });
      document.getElementById('cardHeader').innerText = `Dear ${data.t || 'Friend'}, Happy Raksha Bandhan! ✨`;
      
      const bodyText = data.m ? `"${data.m}"\n\nWith love,\n— ${data.f}` : `Thank you for always being there. Wishing you joy and happiness!\n\nWith love,\n— ${data.f}`;
      document.getElementById('cardBody').innerText = bodyText;

      document.getElementById('receiverZone').classList.add('hidden');
      document.getElementById('messageCard').style.display = 'block';
      initScratch();
    }

    function initScratch() {
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');
      const box = document.getElementById('scratchContainer');
      canvas.width = box.offsetWidth; canvas.height = box.offsetHeight;

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#d4af37'); grad.addColorStop(0.5, '#fff6ad'); grad.addColorStop(1, '#a67c1e');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = '700 12px Poppins'; ctx.fillStyle = '#4a3701'; ctx.textAlign = 'center';
      ctx.fillText('✨ SCRATCH HERE TO SEE WHAT YOU OWE ✨', canvas.width / 2, canvas.height / 2 + 4);

      let drawing = false, done = false;

      function scratch(e) {
        if (!drawing || done) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.fill();

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let clear = 0;
        for (let i = 3; i < imgData.data.length; i += 4) if (imgData.data[i] === 0) clear++;
        if ((clear / (imgData.data.length / 4)) > 0.7) {
          done = true; canvas.style.opacity = '0';
          setTimeout(() => canvas.style.display = 'none', 400);
          confetti({ particleCount: 90 });
        }
      }

      canvas.addEventListener('mousedown', (e) => { drawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      canvas.addEventListener('mouseup', () => drawing = false);
      canvas.addEventListener('touchstart', (e) => { drawing = true; scratch(e); });
      canvas.addEventListener('touchmove', scratch);
      canvas.addEventListener('touchend', () => drawing = false);
    }

    function downloadCard() {
      document.getElementById('dlBtn').style.display = 'none';
      document.getElementById('crBtn').style.display = 'none';
      html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `Rakhi_Greeting.png`;
        link.click();
        document.getElementById('dlBtn').style.display = 'block';
        document.getElementById('crBtn').style.display = 'block';
      });
    }
  </script>
</body>
</html>
